# ─────────────────────────────────────────────────────────────────────────
# CI Pipeline — Task Manager Backend
#
# Triggers: every Pull Request targeting main
#           every push to main
#
# Jobs (in dependency order):
#   lint → test → security → docker-build → image-scan
# ─────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege: only read access by default
# Individual jobs can add write permissions if needed
permissions:
  contents: read

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint & Format ─────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  # ── Job 2: Tests + Coverage ──────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint   # Only run tests if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -v

  # ── Job 3: Security Scanning ─────────────────────────────────────────
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test   # Only scan if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for Gitleaks

      - name: Secret scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Dependency vulnerability scan
        run: |
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt --strict

  # ── Job 4: Docker Build ───────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security  # Only build if security scans pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false        # PR validation only — do not push to registry
          tags: task-manager-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker  # Load into local Docker for scanning

      - name: Save image as artifact
        run: docker save task-manager-api:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ── Job 5: Trivy Image Scan ───────────────────────────────────────────
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build  # Must run AFTER the image is built

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-manager-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"       # Fail CI on HIGH or CRITICAL findings
          ignore-unfixed: true # Ignore vulnerabilities with no fix available yet
